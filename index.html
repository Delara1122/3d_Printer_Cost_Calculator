<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Print Cost Calculators</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transition-all duration-300">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold tracking-tight">Print Cost Calculator</h1>
            <p class="text-blue-100 text-sm mt-1">Estimate your 3D printing costs</p>
        </div>

        <div class="p-6 space-y-5">
            
            <!-- Filament Type -->
            <div>
                <label for="filamentType" class="block text-sm font-medium text-gray-700 mb-1">Filament Type</label>
                <div class="relative">
                    <select id="filamentType" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 appearance-none outline-none transition-colors">
                        <option value="2.50" data-rate="50">PLA / PETG (₱2.50/g, ₱50/hr)</option>
                        <option value="3.00" data-rate="70">ABS / ASA (₱3.00/g, ₱70/hr)</option>
                        <option value="3.50" data-rate="60">TPU (₱3.50/g, ₱60/hr)</option>
                        <option value="4.50" data-rate="90">Nylon / PC (₱4.50/g, ₱90/hr)</option>
                    </select>
                    <!-- Custom select arrow -->
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Weight -->
            <div>
                <label for="weight" class="block text-sm font-medium text-gray-700 mb-1">Filament Weight (Grams)</label>
                <div class="relative">
                    <input type="number" id="weight" min="0" placeholder="e.g. 150" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 pr-10 outline-none transition-colors">
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 text-sm">
                        g
                    </div>
                </div>
            </div>

            <!-- Print Time -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="hours" class="block text-sm font-medium text-gray-700 mb-1">Hours</label>
                    <div class="relative">
                        <input type="number" id="hours" min="0" placeholder="0" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 pr-10 outline-none transition-colors">
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 text-sm">
                            hr
                        </div>
                    </div>
                </div>
                <div>
                    <label for="minutes" class="block text-sm font-medium text-gray-700 mb-1">Minutes</label>
                    <div class="relative">
                        <input type="number" id="minutes" min="0" max="59" placeholder="0" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 pr-10 outline-none transition-colors">
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 text-sm">
                            min
                        </div>
                    </div>
                </div>
            </div>

            <!-- Hourly Rate -->
            <div>
                <label for="hourlyRate" class="block text-sm font-medium text-gray-700 mb-1">Machine & Labor Rate (per Hour)</label>
                <div class="relative">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        ₱
                    </div>
                    <input type="number" id="hourlyRate" min="0" value="50" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 pl-8 outline-none transition-colors">
                </div>
                <p class="text-xs text-gray-500 mt-2">Auto-updates based on filament type, but can be manually overridden.</p>
            </div>

        </div>

        <!-- Results Section -->
        <div class="bg-gray-50 border-t border-gray-200 p-6">
            <h2 class="text-xs uppercase tracking-wider font-semibold text-gray-500 mb-4">Cost Breakdown</h2>
            
            <div class="space-y-3">
                <div class="flex justify-between items-center text-gray-700">
                    <span class="text-sm">Filament Cost</span>
                    <span id="resFilament" class="font-medium">₱0.00</span>
                </div>
                <div class="flex justify-between items-center text-gray-700">
                    <span class="text-sm">Machine & Labor (Time)</span>
                    <span id="resTime" class="font-medium">₱0.00</span>
                </div>
                
                <div class="border-t border-gray-200 pt-3 mt-3 flex justify-between items-center">
                    <span class="text-base font-bold text-gray-900">Total Price</span>
                    <span id="resTotal" class="text-2xl font-bold text-blue-600">₱0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get DOM Elements
        const elFilamentType = document.getElementById('filamentType');
        const elWeight = document.getElementById('weight');
        const elHours = document.getElementById('hours');
        const elMinutes = document.getElementById('minutes');
        const elHourlyRate = document.getElementById('hourlyRate');
        
        const resFilament = document.getElementById('resFilament');
        const resTime = document.getElementById('resTime');
        const resTotal = document.getElementById('resTotal');

        // Function to format numbers as PHP currency
        function formatPHP(amount) {
            return '₱' + amount.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Auto-update hourly rate based on selected filament
        function syncHourlyRate() {
            const selectedOption = elFilamentType.options[elFilamentType.selectedIndex];
            elHourlyRate.value = selectedOption.getAttribute('data-rate');
            calculateCost();
        }

        // Main Calculation Function
        function calculateCost() {
            // Parse inputs
            const pricePerGram = parseFloat(elFilamentType.value) || 0;
            const weight = parseFloat(elWeight.value) || 0;
            const hours = parseFloat(elHours.value) || 0;
            const minutes = parseFloat(elMinutes.value) || 0;
            const hourlyRate = parseFloat(elHourlyRate.value) || 0;

            // Calculate total time in hours
            const totalTimeInHours = hours + (minutes / 60);

            // Calculate costs
            const filamentCost = weight * pricePerGram;
            const timeCost = totalTimeInHours * hourlyRate;
            const totalCost = filamentCost + timeCost;

            // Update UI
            resFilament.textContent = formatPHP(filamentCost);
            resTime.textContent = formatPHP(timeCost);
            resTotal.textContent = formatPHP(totalCost);
        }

        // Sync rate when filament type changes
        elFilamentType.addEventListener('change', syncHourlyRate);

        // Add event listeners to all inputs to trigger calculation instantly
        const inputs = [elFilamentType, elWeight, elHours, elMinutes, elHourlyRate];
        inputs.forEach(input => {
            input.addEventListener('input', calculateCost);
        });

        // Initialize with default values on load
        calculateCost();
    </script>
</body>
</html>
